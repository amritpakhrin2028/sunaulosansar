<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1508;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbc02d;stop-opacity:0.8" />
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <rect width="1200" height="900" fill="rgba(0,0,0,0.15)"/>
  <text x="600" y="420" font-family="Arial" font-size="120" text-anchor="middle" fill="white" opacity="0.9">&#x1F338;</text>
  <text x="600" y="520" font-family="Arial,sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="white" opacity="0.85">Macro</text>
  <text x="600" y="580" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="rgba(255,255,255,0.5)">Sunaulo Sansar Photography</text>
</svg>
